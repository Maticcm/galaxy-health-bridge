name: Build unsigned iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate project and resolve dependencies
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project GalaxyHealthBridge.xcodeproj -scheme GalaxyHealthBridge
      # The repository CI workflow runs simulator tests on every push. This
      # workflow packages the device binary; it does not repeat the simulator run.
      - name: Build device application without credentials
        run: |
          set -euo pipefail
          xcodebuild build -project GalaxyHealthBridge.xcodeproj -scheme GalaxyHealthBridge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/health-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
      - name: Validate HealthKit and package IPA for local signing
        run: |
          set -euo pipefail
          ENTITLEMENTS=GalaxyHealthBridge/App/GalaxyHealthBridge.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$ENTITLEMENTS")" = true
          APP="$RUNNER_TEMP/health-build/Build/Products/Release-iphoneos/GalaxyHealthBridge.app"
          test -f "$APP/Info.plist"
          test -f "$APP/GalaxyHealthBridge"
          file "$APP/GalaxyHealthBridge" | grep -q arm64
          otool -L "$APP/GalaxyHealthBridge" | grep -q HealthKit
          # Ad-hoc signing embeds the requested entitlements for AltStore to read.
          # It uses no Apple identity, certificate, key, or provisioning profile.
          codesign --force --sign - --entitlements "$ENTITLEMENTS" --generate-entitlement-der "$APP"
          codesign --verify --strict "$APP"
          codesign --display --entitlements - "$APP" > "$RUNNER_TEMP/embedded-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$RUNNER_TEMP/embedded-entitlements.plist")" = true
          mkdir -p "$RUNNER_TEMP/health-package/Payload" "$GITHUB_WORKSPACE/artifacts"
          ditto "$APP" "$RUNNER_TEMP/health-package/Payload/GalaxyHealthBridge.app"
          (cd "$RUNNER_TEMP/health-package" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/artifacts/GalaxyHealthBridge.ipa" Payload)
          cp "$ENTITLEMENTS" "$GITHUB_WORKSPACE/artifacts/required-entitlements.plist"
          cp "$RUNNER_TEMP/embedded-entitlements.plist" "$GITHUB_WORKSPACE/artifacts/embedded-entitlements.plist"
          printf '%s\n' 'Device build with ad-hoc signature to retain requested HealthKit entitlements. No Apple signing identity used. AltStore must obtain a HealthKit-enabled profile and sign locally. Installation alone does not verify Apple Health writes.' > "$GITHUB_WORKSPACE/artifacts/SIGNING-NOTE.txt"
          (cd "$GITHUB_WORKSPACE/artifacts" && shasum -a 256 GalaxyHealthBridge.ipa > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyHealthBridge-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
